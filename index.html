<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>IKI1UC – Pipeline</title>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: monospace;
            padding: 20px;
        }
        #input {
            width: 400px;
            padding: 10px;
            font-size: 18px;
            background: #222;
            color: #0f0;
            border: 1px solid #444;
        }
        #log {
            margin-top: 20px;
            white-space: pre;
            font-size: 14px;
        }
    </style>
</head>

<body>

<h2>IKI1UC – Pipeline</h2>
<input id="input" placeholder="ENTER → Pipeline Load">

<div id="log"></div>

<script type="module">

    import { PIPELINE_LOAD } from "./boot.room";

    const input = document.getElementById("input");
    const log = document.getElementById("log");

    document.addEventListener("keydown", e => {
        if (e.key === "Enter") {
            const text = input.value;
            const out = PIPELINE_LOAD(text);

            log.innerText = JSON.stringify(out, null, 2);
        }
    });

</script>

</body>
</html>
